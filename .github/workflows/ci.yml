name: Avatar CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Run API tests
        run: docker compose exec -T api python -m unittest discover -s api -p "test_*.py" -v

      - name: Check frontend build
        run: docker compose exec -T web yarn build

      - name: Show logs if a step fails
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down

  publish:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component: [api, web]

    env:
      IMAGE: ghcr.io/aparna7890/avatars-${{ matrix.component }}
      TAG: ${{ github.sha }}

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Sign in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build versioned image
        run: |
          docker build \
            --file deploy/${{ matrix.component }}.dockerfile \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:latest" \
            .

      - name: Publish image
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"